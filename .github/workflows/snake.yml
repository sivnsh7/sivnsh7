name: Generate Contribution Snake

on:
  # Generate daily, and allow manual runs from the Actions tab.
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate pink contribution snake SVGs
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: sivnsh7
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=FF69B4&color_dots=EDEDED,F8BBD0,EF93C4,E754A4,8A2865
            dist/github-contribution-grid-snake-dark.svg?color_snake=FF69B4&color_dots=161B22,4D193D,8A2865,EF93C4,F8BBD0

      - name: Publish SVGs to the output branch
        uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
